# air config — hot-reload for `relay daemon` during development.
# Watches packages/daemon-go/. Triggers rebuild + restart.

root = "."
tmp_dir = ".air-tmp"

[build]
cmd       = "go build -o ./.air-tmp/relay ./cmd/relay"
bin       = "./.air-tmp/relay"
full_bin  = ""
include_ext      = ["go", "tpl", "tmpl", "html"]
exclude_dir      = ["assets", "tmp", "vendor", "testdata"]
include_dir      = []
exclude_file     = []
exclude_regex    = ["_test\\.go"]
exclude_unchanged = true
follow_symlink    = false
log               = "build-errors.log"
poll              = false
poll_interval     = 500
delay             = 200
stop_on_error     = false
send_interrupt    = true
kill_delay        = 500

[color]
main    = "magenta"
watcher = "cyan"
build   = "yellow"
runner  = "green"

[log]
time = true
