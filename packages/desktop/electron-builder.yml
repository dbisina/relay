appId: dev.relay.desktop
productName: Relay
copyright: Copyright © 2026 Daniel Bisina
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  # Runtime window/taskbar icon, found by windowIcon() via process.resourcesPath.
  - from: resources/icon.png
    to: icon.png
  # Tray icon (small, crisp at 20x20), found by trayIcon() the same way.
  - from: resources/tray.png
    to: tray.png
  # The Relay daemon binary (`relay`) is expected on PATH or beside the app.
  # Bundle it here once the release pipeline produces per-platform binaries:
  # - from: ../daemon-go/dist/relay${/*}
  #   to: bin/
asarUnpack:
  - "**/node_modules/ws/**"
win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: Relay-${version}-setup.${ext}
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  artifactName: Relay-${version}.${ext}
linux:
  target:
    - AppImage
  category: Development
  artifactName: Relay-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  shortcutName: Relay
  createDesktopShortcut: true
  createStartMenuShortcut: true
