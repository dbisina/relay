[package]
name = "relay-ui"
version = "0.0.1"
edition = "2021"
description = "Relay desktop dashboard — eframe/egui"
license = "Apache-2.0"
repository = "https://github.com/dbisina/relay"
readme = "../../README.md"

[[bin]]
name = "relay-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
