name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── CLI + TUI (Go) and the legacy egui desktop app (Rust) ──────────────────
  build:
    name: CLI/TUI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: packages/daemon-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ui

      # Cross-compilation deps for Linux ARM64
      - name: Install cross-compilation tools
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # Build Go binary
      - name: Build relay (Go)
        working-directory: packages/daemon-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "../../dist/relay${EXT}" ./cmd/relay
        shell: bash

      # Build the legacy egui desktop app. Superseded by the Electron client in
      # packages/desktop, still shipped so existing users are not stranded.
      - name: Build relay-ui (Rust, legacy)
        working-directory: packages/ui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --quiet
        shell: bash

      - name: Copy Rust binary
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp "packages/ui/target/${{ matrix.rust_target }}/release/relay-ui${EXT}" "dist/relay-ui${EXT}" 2>/dev/null || \
          cp "target/${{ matrix.rust_target }}/release/relay-ui${EXT}" "dist/relay-ui${EXT}"
        shell: bash

      # Package
      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar czf "relay-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" relay relay-ui
        shell: bash

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          7z a "relay-${{ github.ref_name }}-${{ matrix.target }}.zip" relay.exe relay-ui.exe
        shell: bash

      - name: Build Windows installer (setup.exe)
        if: matrix.target == 'windows-amd64'
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc /DMyAppVersion=${{ github.ref_name }} scripts\installer.iss
          Rename-Item dist\relay-setup.exe "relay-${{ github.ref_name }}-windows-amd64-setup.exe"
        shell: pwsh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          # relay-* alone also matches the raw relay-ui/relay-ui.exe binary
          # (it starts with "relay-" too), leaking it onto the release page
          # next to the real per-platform archives. Scope to the packaged
          # formats only.
          path: |
            dist/relay-*.tar.gz
            dist/relay-*.zip
            dist/relay-*-setup.exe

  # ── Electron desktop app ───────────────────────────────────────────────────
  # Bundles the matching `relay` daemon binary into resources/bin so the
  # installer is self-contained (see daemon.ts findRelayBinary).
  desktop:
    name: Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            artefacts: "release/*.AppImage"
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            artefacts: "release/*.dmg"
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            artefacts: "release/*-setup.exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: packages/daemon-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      # The daemon that ships inside the app bundle. On Windows this is linked
      # as a GUI-subsystem binary (-H=windowsgui): the loader then never
      # allocates a console for it, so Electron spawning it headlessly can't
      # flash a console window no matter how AV scanning or windowsHide
      # timing behaves. It still prints fine when run from an existing
      # terminal (verified: `relay --version` and `relay daemon` both work
      # normally), since inherited std handles work the same regardless of
      # subsystem. The CLI/TUI archives built in the job above are unaffected
      # and stay console-subsystem, which is what an interactive tool wants.
      - name: Build relay daemon for bundling
        working-directory: packages/daemon-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
            LDFLAGS="${LDFLAGS} -H=windowsgui"
          fi
          mkdir -p ../desktop/resources/bin
          go build -trimpath -ldflags="${LDFLAGS}" \
            -o "../desktop/resources/bin/relay${EXT}" ./cmd/relay
        shell: bash

      - name: Install dependencies
        working-directory: packages/desktop
        run: npm ci
        shell: bash

      # Keep the installer's version in step with the tag rather than whatever
      # is checked into package.json.
      - name: Set version from tag
        working-directory: packages/desktop
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Typecheck
        working-directory: packages/desktop
        run: npm run typecheck
        shell: bash

      # electron-builder fetches the Electron runtime zip from GitHub the
      # first time it packages, and that download has no retry of its own: a
      # bare EOF from the CDN killed the v0.2.1 release and skipped publish
      # entirely. Retry before failing the tag.
      - name: Build and package
        working-directory: packages/desktop
        env:
          # Unsigned for now: no certificate in CI. Installers will warn on
          # first launch until signing is set up.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3; do
            if npm run package; then exit 0; fi
            echo "package attempt ${attempt} failed, retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "package failed after 3 attempts"
          exit 1
        shell: bash

      # electron-builder embeds the version in artifactName, which is right for
      # an archive but breaks a stable download link. Add a version-free copy
      # per platform so `releases/latest/download/Relay-<OS>.<ext>` always
      # resolves to the newest build. The versioned file is kept too, for people
      # who want a specific version. The upload globs below match both.
      - name: Add a stable-named copy for one-click downloads
        working-directory: packages/desktop/release
        run: |
          case "${{ matrix.goos }}" in
            windows) cp "$(ls *-setup.exe | head -1)" "Relay-Windows-Setup.exe" ;;
            darwin)  cp "$(ls *.dmg       | head -1)" "Relay-macOS.dmg" ;;
            linux)   cp "$(ls *.AppImage  | head -1)" "Relay-Linux.AppImage" ;;
          esac
          ls -la
        shell: bash

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: packages/desktop/${{ matrix.artefacts }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI/TUI artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: release-*
          merge-multiple: true

      - name: Download desktop artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: desktop-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artefacts
          # Exclude the sums file itself; CLI archives are relay-*, desktop
          # installers are Relay-*.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artefacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            **Desktop app (Electron)** is the recommended client. The daemon is
            bundled inside, so the installer is self-contained.

            | Platform | File |
            |---|---|
            | Windows | `Relay-*-setup-windows-amd64.exe` |
            | macOS (Apple silicon) | `Relay-*-darwin-arm64.dmg` |
            | Linux | `Relay-*-linux-amd64.AppImage` |

            **CLI and TUI** ship in the `relay-<version>-<platform>` archives.
            Extract and put `relay` on your PATH, then `relay run "task"` or
            `relay tui`.

            The `relay-ui` binary inside those archives is the **legacy** egui
            desktop app, superseded by the Electron client above. It is still
            built so existing setups keep working.

            ## About the security warning

            These builds are **not code-signed** yet, so Windows SmartScreen and some
            antivirus tools will warn on first run. This is expected for a project this
            new: free signing from [SignPath.io](https://signpath.io) requires more
            public usage history than the project has built up so far, and a paid
            certificate is not yet in place. Neither means the binary is unsafe, only
            that it has no publisher reputation attached to it yet.

            To run it anyway on Windows: click "More info", then "Run anyway" on the
            SmartScreen prompt. Verify the download matches `SHA256SUMS` first if you
            want extra assurance.

            Relay runs locally and will not transfer any information to other
            networked systems unless specifically requested by the user or the
            person installing or operating it. Full policy:
            [docs/code-signing-policy.md](https://github.com/dbisina/relay/blob/main/docs/code-signing-policy.md).

            Verify downloads against `SHA256SUMS`.
