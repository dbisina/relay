name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - target: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
          - target: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: packages/daemon-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ui

      # Cross-compilation deps for Linux ARM64
      - name: Install cross-compilation tools
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # Build Go binary
      - name: Build relay (Go)
        working-directory: packages/daemon-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "../../dist/relay${EXT}" ./cmd/relay
        shell: bash

      # Build Rust binary
      - name: Build relay-ui (Rust)
        working-directory: packages/ui
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.rust_target }} --quiet
        shell: bash

      - name: Copy Rust binary
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cp "packages/ui/target/${{ matrix.rust_target }}/release/relay-ui${EXT}" "dist/relay-ui${EXT}" 2>/dev/null || \
          cp "target/${{ matrix.rust_target }}/release/relay-ui${EXT}" "dist/relay-ui${EXT}"
        shell: bash

      # Package
      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar czf "relay-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" relay relay-ui
        shell: bash

      - name: Package (zip)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          7z a "relay-${{ github.ref_name }}-${{ matrix.target }}.zip" relay.exe relay-ui.exe
        shell: bash

      - name: Build Windows installer (setup.exe)
        if: matrix.target == 'windows-amd64'
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc /DMyAppVersion=${{ github.ref_name }} scripts\installer.iss
          Rename-Item dist\relay-setup.exe "relay-${{ github.ref_name }}-windows-amd64-setup.exe"
        shell: pwsh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/relay-*

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artefacts
          sha256sum relay-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artefacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
