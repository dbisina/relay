# Relay configuration — relay.toml
# Generated by relay init

[relay]
server_port = 4748

[providers.claude]
enabled     = true
declared_cap = 40000   # tokens; calibrated from first proxy header

[providers.codex]
enabled     = true
declared_cap = 500     # requests

[providers.antigravity]
enabled     = true
declared_cap = 1000    # requests/day (agy quota)

[providers.opencode]
enabled     = true
declared_cap = 500

[providers.ollama]
enabled     = true
model       = "qwen2.5-coder:32b"
base_url    = "http://localhost:11434"

[providers.copilot]
enabled     = true
declared_cap = 300

[providers.continue]
enabled     = true
declared_cap = 500

[providers.cline]
enabled     = true
declared_cap = 500
